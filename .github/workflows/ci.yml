name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an older run's result moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Matches the Node major Vercel builds with.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # The suite mocks Supabase, Anthropic and the embedder, so this job holds
      # no secrets. A test that needs a real key belongs outside this suite.
      - run: npm test

      # The real parser-thread stress tests, skipped in `npm test`. Run here on
      # Linux, the slower CPU the extraction time limits have to hold on, in a
      # step of their own and one file at a time: their parser threads saturate
      # the runner's CPUs, which made other files' timing tests and their own
      # main-loop checks fail when they shared it with the rest of the suite.
      - run: npx vitest run --no-file-parallelism src/lib/__tests__/extract.qa6.realThread.test.ts src/lib/__tests__/extract.qa7.realThread.test.ts
        env:
          EXTRACT_STRESS: "1"
